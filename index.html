<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBERSTORM 3D - Ultra Realism</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010103;
            font-family: 'Orbitron', 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Responsive Glassmorphism HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }
        .hud-card {
            background: rgba(8, 12, 24, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25), inset 0 0 10px rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 12px;
            min-width: 130px;
        }
        .hud-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: #38bdf8;
            text-transform: uppercase;
        }
        .hud-value {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }
        .nitro-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }
        #nitro-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff0055, #ffaa00, #00f0ff);
            box-shadow: 0 0 10px #00f0ff;
        }

        /* On-Screen Mobile Touch Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100vw;
            height: 120px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 12;
            pointer-events: none;
        }
        .touch-btn {
            pointer-events: auto;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            font-size: 1.8rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            active {
                background: rgba(0, 240, 255, 0.4);
            }
        }
        #nitro-touch-btn {
            border-color: #ff0055;
            color: #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            width: 85px;
            height: 85px;
            font-size: 1rem;
            text-transform: uppercase;
        }

        /* Overlay Interface */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(10, 15, 30, 0.88) 0%, rgba(1, 1, 3, 0.96) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(15px);
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00f0ff, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 25px;
            max-width: 480px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #00f0ff, #7928ca);
            color: #ffffff;
            border: none;
            padding: 16px 45px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hidden {
            display: none !important;
        }

        /* Crash Flash Effect */
        #flash-screen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #ff0055;
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            transition: opacity 0.1s ease;
        }
    </style>

    <!-- Google Fonts & Three.js CDN -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="flash-screen"></div>

    <!-- HUD Overlay -->
    <div id="hud">
        <div class="hud-card">
            <div class="hud-label">Score</div>
            <div id="score-val" class="hud-value">0</div>
        </div>
        <div class="hud-card" style="text-align: right;">
            <div class="hud-label">Speed</div>
            <div id="speed-val" class="hud-value">0 <span style="font-size: 0.8rem;">KM/H</span></div>
            <div class="hud-label" style="margin-top: 6px;">Nitro</div>
            <div class="nitro-container">
                <div id="nitro-bar"></div>
            </div>
        </div>
    </div>

    <!-- Mobile Screen Controls -->
    <div id="mobile-controls">
        <div id="btn-left" class="touch-btn">◄</div>
        <div id="nitro-touch-btn" class="touch-btn">NITRO</div>
        <div id="btn-right" class="touch-btn">►</div>
    </div>

    <!-- Main Menu & Game Over Screen -->
    <div id="overlay">
        <h1 id="main-title">CYBER RACER 3D</h1>
        <p id="sub-title">Drive through the hyper-realistic cyberpunk corridor. Use <strong>A / D</strong> or Touch Buttons to steer. Hold <strong>SPACEBAR / NITRO</strong> to activate boosters!</p>
        <button id="start-btn" class="btn">Start Engine</button>
    </div>

    <script>
        // Game State
        const LANES = [-3.8, 0, 3.8];
        let currentLane = 1;
        let targetX = LANES[currentLane];
        let score = 0;
        let baseSpeed = 0.85;
        let currentSpeed = baseSpeed;
        let nitroAmount = 100;
        let isNitroActive = false;
        let isGameActive = false;
        let obstacles = [];
        let particles = [];

        // Three.js Engine Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010103, 0.011);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.2, 8.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        container.appendChild(renderer.domElement);

        // Realistic Dynamic Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Neon Glow Point Lights
        const cyanPoint = new THREE.PointLight(0x00f0ff, 5, 50);
        cyanPoint.position.set(-8, 4, -30);
        scene.add(cyanPoint);

        const pinkPoint = new THREE.PointLight(0xff0055, 5, 50);
        pinkPoint.position.set(8, 4, -60);
        scene.add(pinkPoint);

        // -------------------------------------------------------------
        // HIGH-GRAPHICS VEHICLE CREATION (PBR Metallic Shaders)
        // -------------------------------------------------------------
        const playerGroup = new THREE.Group();

        const carBodyMat = new THREE.MeshStandardMaterial({
            color: 0x07080d,
            metalness: 0.95,
            roughness: 0.1
        });

        // Aerodynamic Shell
        const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.45, 3.6), carBodyMat);
        chassis.position.y = 0.45;
        chassis.castShadow = true;
        playerGroup.add(chassis);

        // Glass Cockpit
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 1.0, roughness: 0.0 });
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 1.7), cabinMat);
        cabin.position.set(0, 0.8, -0.2);
        playerGroup.add(cabin);

        // Glowing Underglow Base
        const underglow = new THREE.Mesh(
            new THREE.PlaneGeometry(1.8, 3.4),
            new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide })
        );
        underglow.rotation.x = Math.PI / 2;
        underglow.position.y = 0.05;
        playerGroup.add(underglow);

        scene.add(playerGroup);

        // -------------------------------------------------------------
        // HIGHWAY & ENVIRONMENT CREATION
        // -------------------------------------------------------------
        const roadGroup = new THREE.Group();
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x05070e, roughness: 0.5, metalness: 0.4 });
        const road = new THREE.Mesh(new THREE.PlaneGeometry(13, 500), roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -200;
        road.receiveShadow = true;
        roadGroup.add(road);

        // Side Rails
        const railMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
        [-6.6, 6.6].forEach(x => {
            const rail = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.35, 500), railMat);
            rail.position.set(x, 0.2, -200);
            roadGroup.add(rail);
        });

        // Dashed Lane Lines
        const dashMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        for (let z = 50; z > -450; z -= 12) {
            [-1.9, 1.9].forEach(x => {
                const dash = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.02, 5), dashMat);
                dash.position.set(x, 0.02, z);
                roadGroup.add(dash);
            });
        }
        scene.add(roadGroup);

        // Skyscrapers & Neon Signs
        const neonColors = [0x00f0ff, 0xff0055, 0x7928ca, 0xfacc15];
        function createCity() {
            for (let z = 50; z > -450; z -= 22) {
                [-20, 20].forEach(x => {
                    const h = 20 + Math.random() * 50;
                    const b = new THREE.Mesh(
                        new THREE.BoxGeometry(10, h, 14),
                        new THREE.MeshStandardMaterial({ color: 0x030408, roughness: 0.5 })
                    );
                    b.position.set(x, h / 2, z);

                    const stripe = new THREE.Mesh(
                        new THREE.BoxGeometry(10.2, 1.2, 10.2),
                        new THREE.MeshBasicMaterial({ color: neonColors[Math.floor(Math.random() * neonColors.length)] })
                    );
                    stripe.position.set(x, Math.random() * h * 0.7 + 4, z);

                    scene.add(b);
                    scene.add(stripe);
                });
            }
        }
        createCity();

        // -------------------------------------------------------------
        // OBSTACLES & PARTICLES
        // -------------------------------------------------------------
        function spawnTraffic() {
            const laneIdx = Math.floor(Math.random() * 3);
            const obstacleGroup = new THREE.Group();

            const obsMat = new THREE.MeshStandardMaterial({
                color: neonColors[Math.floor(Math.random() * neonColors.length)],
                metalness: 0.8, roughness: 0.2
            });

            const body = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.6, 3.2), obsMat);
            body.position.y = 0.45;
            body.castShadow = true;
            obstacleGroup.add(body);

            obstacleGroup.position.set(LANES[laneIdx], 0, -220);
            scene.add(obstacleGroup);
            obstacles.push(obstacleGroup);
        }

        function createExhaustParticle() {
            const p = new THREE.Mesh(
                new THREE.SphereGeometry(0.1, 8, 8),
                new THREE.MeshBasicMaterial({ color: isNitroActive ? 0xff0055 : 0x00f0ff, transparent: true, opacity: 0.9 })
            );
            p.position.set(
                playerGroup.position.x + (Math.random() - 0.5) * 0.5,
                0.3,
                playerGroup.position.z + 1.8
            );
            scene.add(p);
            particles.push({ mesh: p, life: 1.0 });
        }

        // -------------------------------------------------------------
        // CONTROLS (KEYBOARD & MOBILE TOUCH)
        // -------------------------------------------------------------
        function moveLeft() {
            if (isGameActive && currentLane > 0) { currentLane--; targetX = LANES[currentLane]; }
        }
        function moveRight() {
            if (isGameActive && currentLane < 2) { currentLane++; targetX = LANES[currentLane]; }
        }

        window.addEventListener('keydown', (e) => {
            if (!isGameActive) return;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
            if (e.key === ' ' || e.key === 'w' || e.key === 'W') isNitroActive = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === ' ' || e.key === 'w' || e.key === 'W') isNitroActive = false;
        });

        // Touch Listeners for Mobile
        document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
        document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });
        
        const nitroTouchBtn = document.getElementById('nitro-touch-btn');
        nitroTouchBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isNitroActive = true; });
        nitroTouchBtn.addEventListener('touchend', (e) => { e.preventDefault(); isNitroActive = false; });

        // -------------------------------------------------------------
        // GAME LOOP
        // -------------------------------------------------------------
        const clock = new THREE.Clock();
        let spawnTimer = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (!isGameActive) {
                renderer.render(scene, camera);
                return;
            }

            const delta = clock.getDelta();
            spawnTimer += delta;

            // Nitro Logic
            if (isNitroActive && nitroAmount > 0) {
                currentSpeed = THREE.MathUtils.lerp(currentSpeed, baseSpeed * 1.65, 0.1);
                nitroAmount = Math.max(0, nitroAmount - delta * 40);
            } else {
                currentSpeed = THREE.MathUtils.lerp(currentSpeed, baseSpeed, 0.05);
                if (nitroAmount < 100) nitroAmount += delta * 12;
            }
            document.getElementById('nitro-bar').style.width = `${nitroAmount}%`;

            // Score & HUD Update
            baseSpeed += 0.00007;
            score += Math.floor(currentSpeed * 20);
            document.getElementById('score-val').innerText = score;
            document.getElementById('speed-val').innerHTML = `${Math.floor(currentSpeed * 220)} <span style="font-size: 0.8rem;">KM/H</span>`;

            // Steering & Camera Tilt
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.18;
            playerGroup.rotation.z = (playerGroup.position.x - targetX) * 0.08;
            camera.position.x = playerGroup.position.x * 0.25;
            camera.fov = THREE.MathUtils.lerp(camera.fov, isNitroActive ? 76 : 65, 0.1);
            camera.updateProjectionMatrix();

            // Spawn Obstacles
            if (spawnTimer > Math.max(0.45, 1.8 - baseSpeed)) {
                spawnTraffic();
                spawnTimer = 0;
            }

            // Move Obstacles & Collision Check
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += currentSpeed * 45 * delta;

                const dz = Math.abs(obs.position.z - playerGroup.position.z);
                const dx = Math.abs(obs.position.x - playerGroup.position.x);

                if (dz < 2.5 && dx < 1.2) {
                    triggerCrash();
                    return;
                }

                if (obs.position.z > 15) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // Exhaust Particles
            createExhaustParticle();
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.z += 0.5;
                p.mesh.scale.multiplyScalar(0.92);
                p.life -= delta * 2.5;
                p.mesh.material.opacity = p.life;

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            // Move Neon Lights
            cyanPoint.position.z = (cyanPoint.position.z + currentSpeed * 20 * delta) % 100 - 100;
            pinkPoint.position.z = (pinkPoint.position.z + currentSpeed * 20 * delta) % 100 - 100;

            renderer.render(scene, camera);
        }

        // -------------------------------------------------------------
        // STATE CONTROL
        // -------------------------------------------------------------
        function startGame() {
            obstacles.forEach(o => scene.remove(o));
            obstacles = [];

            score = 0;
            baseSpeed = 0.85;
            currentSpeed = baseSpeed;
            nitroAmount = 100;
            currentLane = 1;
            targetX = LANES[currentLane];
            playerGroup.position.set(0, 0, 0);

            document.getElementById('overlay').classList.add('hidden');
            isGameActive = true;
            clock.start();
        }

        function triggerCrash() {
            isGameActive = false;
            
            const flash = document.getElementById('flash-screen');
            flash.style.opacity = '0.8';
            setTimeout(() =>
